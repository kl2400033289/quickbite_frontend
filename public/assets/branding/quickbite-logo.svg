<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" fill="none">
  <defs>
    <!-- Teal Helmet Gradient from Video (Pip's Helmet) -->
    <linearGradient id="qb_teal_helmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="60%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="qb_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Pip's Teal Helmet 'Q' Emblem -->
  <g transform="translate(10, 10)">
    <!-- Rounded squircle badge -->
    <rect width="60" height="60" rx="18" fill="url(#qb_teal_helmet)" filter="url(#qb_shadow)"/>
    <rect x="0.5" y="0.5" width="59" height="59" rx="17.5" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    
    <!-- Bold white Q monogram slanted -6deg -->
    <g transform="skewX(-6) translate(6, 0)">
      <path d="M 30 11 C 18 11 9 20 9 32 C 9 44 18 53 30 53 C 35.5 53 40.5 51 44.5 47 L 49.5 52 C 50.5 53 52 52.5 52 51 L 52 45.5 C 52 44.5 51.5 44 50.5 44 L 47.5 44 C 50 40.5 51.5 36.5 51.5 32 C 51.5 20 42 11 30 11 Z M 30 20 C 36.5 20 41.5 25.5 41.5 32 C 41.5 38.5 36.5 44 30 44 C 23.5 44 18.5 38.5 18.5 32 C 18.5 25.5 23.5 20 30 20 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Slanted Wordmark: "Quick" (#14171B) + "Bite" (#FF5A1F) -->
  <g transform="translate(86, 52) skewX(-10)">
    <!-- "Quick" in Charcoal -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="38" font-weight="900" font-style="italic" fill="#14171B" letter-spacing="-1">Quick</text>
    <!-- "Bite" in Vibrant Tangerine -->
    <text x="108" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="38" font-weight="900" font-style="italic" fill="#FF5A1F" letter-spacing="-1">Bite</text>
  </g>
</svg>
