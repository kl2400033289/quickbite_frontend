<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340" fill="none">
  <defs>
    <linearGradient id="topOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D49"/>
      <stop offset="60%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="customerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#FF5A1F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="150" cy="315" rx="75" ry="12" fill="#14171B" fill-opacity="0.1"/>

  <!-- Customer Torso & Reddish-Orange Top -->
  <g transform="translate(100, 160)">
    <!-- Reddish-Orange Top -->
    <path d="M20 30 C10 45 6 95 6 130 L94 130 C94 95 90 45 80 30 C72 20 62 18 50 18 C38 18 28 20 20 30 Z" fill="url(#topOrange)" filter="url(#customerShadow)"/>
    <!-- White neckline detail -->
    <path d="M38 18 C42 26 58 26 62 18" stroke="#FFF5F0" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Left Arm presenting food tray -->
    <path d="M14 45 L-20 70 L-45 50" stroke="#FED7AA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Hand holding dish -->
    <circle cx="-47" cy="48" r="8" fill="#FDBA74"/>

    <!-- Right Arm welcoming / celebrating -->
    <path d="M86 45 L118 70 L135 48" stroke="#FED7AA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Hand -->
    <circle cx="137" cy="46" r="8" fill="#FDBA74"/>
    <!-- Little joy sparkles near hand -->
    <path d="M145 28 L149 34 L155 35 L149 39 L147 45 L143 40 L137 38 L142 34 Z" fill="#F59E0B"/>
  </g>

  <!-- Delicious Presented Food Cloche / Bowl -->
  <g transform="translate(30, 170)">
    <ellipse cx="30" cy="40" rx="28" ry="8" fill="#E5E7EB"/>
    <path d="M8 38 Q30 10 52 38 Z" fill="#FEF08A" stroke="#F59E0B" stroke-width="2"/>
    <!-- Little delicious food steam -->
    <path d="M24 10 Q28 2 24 -6" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M36 12 Q40 4 36 -4" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Neck & Face -->
  <g transform="translate(118, 70)">
    <!-- Neck -->
    <rect x="24" y="65" width="16" height="25" rx="5" fill="#FDBA74"/>

    <!-- Face Oval -->
    <ellipse cx="32" cy="45" rx="28" ry="32" fill="#FED7AA"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="14" cy="52" rx="6" ry="4" fill="#F87171" fill-opacity="0.5"/>
    <ellipse cx="50" cy="52" rx="6" ry="4" fill="#F87171" fill-opacity="0.5"/>

    <!-- Warm Cheerful Smile with Teeth -->
    <path d="M22 55 Q32 70 42 55 Z" fill="#991B1B"/>
    <path d="M24 56 Q32 62 40 56 Z" fill="#FFFFFF"/>

    <!-- Cheerful Eyes & Eyebrows -->
    <path d="M16 38 Q22 34 26 38" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M38 38 Q42 34 48 38" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="21" cy="42" r="3.5" fill="#1F2937"/>
    <circle cx="43" cy="42" r="3.5" fill="#1F2937"/>
    <circle cx="22" cy="40.5" r="1.2" fill="#FFFFFF"/>
    <circle cx="44" cy="40.5" r="1.2" fill="#FFFFFF"/>

    <!-- Dark Hair with Side Bangs -->
    <path d="M6 38 C6 14 58 14 58 38 C58 22 46 16 32 16 C18 16 6 22 6 38 Z" fill="url(#hairDark)"/>
    <path d="M6 38 C14 42 22 32 26 30" stroke="#111827" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M58 38 C50 42 42 32 38 30" stroke="#111827" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Elegant Hair Bun on Top -->
    <ellipse cx="32" cy="10" rx="18" ry="16" fill="url(#hairDark)"/>
    <!-- Reddish-Orange Hair Scrunchie -->
    <ellipse cx="32" cy="18" rx="14" ry="5" fill="#FF5A1F"/>
  </g>
</svg>