<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <defs>
    <linearGradient id="riderGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="scooterTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="boxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7D49"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
    <filter id="riderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15803D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="160" cy="285" rx="100" ry="14" fill="#14171B" fill-opacity="0.12"/>

  <!-- Scooter Back Wheel -->
  <g transform="translate(70, 230)">
    <circle cx="28" cy="28" r="28" fill="#1F2937"/>
    <circle cx="28" cy="28" r="18" fill="#9CA3AF"/>
    <circle cx="28" cy="28" r="8" fill="#4B5563"/>
  </g>

  <!-- Scooter Front Wheel -->
  <g transform="translate(210, 230)">
    <circle cx="28" cy="28" r="28" fill="#1F2937"/>
    <circle cx="28" cy="28" r="18" fill="#9CA3AF"/>
    <circle cx="28" cy="28" r="8" fill="#4B5563"/>
  </g>

  <!-- Scooter Body (Vibrant Green) -->
  <path d="M98 250 L140 250 Q160 250 170 235 L195 195 Q205 180 215 180 L228 180 Q235 180 238 215 L242 245" stroke="url(#riderGreen)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Footrest & Scooter deck -->
  <rect x="110" y="240" width="75" height="12" rx="6" fill="#15803D"/>
  <!-- Scooter Front Fork & Handlebar -->
  <path d="M228 180 L218 135 L200 135" stroke="#374151" stroke-width="8" stroke-linecap="round"/>
  <!-- Headlight beam -->
  <path d="M236 175 L280 160 L280 200 Z" fill="#FDE047" fill-opacity="0.3"/>
  <circle cx="236" cy="180" r="7" fill="#FEF08A"/>

  <!-- QuickBite Thermal Box (Attached to rear rack) -->
  <g transform="translate(60, 140)">
    <rect width="65" height="70" rx="12" fill="url(#boxOrange)" filter="url(#riderGlow)"/>
    <rect x="6" y="8" width="53" height="10" rx="4" fill="#FFFFFF" fill-opacity="0.3"/>
    <circle cx="32" cy="42" r="14" fill="#FFFFFF"/>
    <text x="32" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#FF5A1F" text-anchor="middle">Q</text>
    <!-- Reflective Stripes -->
    <rect x="6" y="58" width="53" height="4" rx="2" fill="#FEF08A"/>
  </g>

  <!-- Delivery Rider Body (Green Uniform) -->
  <g transform="translate(130, 115)">
    <!-- Legs in motion/sitting -->
    <path d="M25 75 L15 110 L45 125" stroke="#166534" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Torso (Green Uniform) -->
    <rect x="12" y="25" width="46" height="55" rx="14" fill="url(#riderGreen)"/>
    <path d="M35 25 L35 80" stroke="#14532D" stroke-width="3" stroke-dasharray="4 2"/>
    <!-- QuickBite Badge on chest -->
    <circle cx="24" cy="42" r="6" fill="#FFFFFF"/>
    <circle cx="24" cy="42" r="3" fill="#FF5A1F"/>

    <!-- Left Arm holding handlebar -->
    <path d="M48 38 L72 55 L82 45" stroke="url(#riderGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glove -->
    <circle cx="82" cy="45" r="7" fill="#1F2937"/>

    <!-- Right Arm friendly wave -->
    <path d="M18 38 L-8 30 L-14 8" stroke="url(#riderGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-14" cy="6" r="8" fill="#1F2937"/>
    <!-- Little wave motion lines -->
    <path d="M-28 4 Q-22 0 -24 -8" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-20 -10 Q-14 -14 -16 -20" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Green Helmet & Cheerful Face -->
  <g transform="translate(142, 70)">
    <!-- Head / Neck -->
    <rect x="18" y="38" width="16" height="16" rx="4" fill="#FBBF24"/>
    <circle cx="26" cy="24" r="24" fill="#FDE68A"/>
    <!-- Cheerful Smile & Rosy Cheek -->
    <ellipse cx="14" cy="28" rx="4" ry="2.5" fill="#F87171" fill-opacity="0.6"/>
    <path d="M22 28 Q28 36 34 28" stroke="#92400E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Friendly Eye -->
    <circle cx="30" cy="20" r="3" fill="#451A03"/>

    <!-- Green Helmet -->
    <path d="M2 18 C2 -2 50 -2 50 18 C50 24 46 28 38 28 L14 28 C6 28 2 24 2 18 Z" fill="url(#riderGreen)" filter="url(#riderGlow)"/>
    <!-- Visor (Glossy shield) -->
    <path d="M28 14 L46 14 C48 18 47 24 42 26 L26 26 Z" fill="#38BDF8" fill-opacity="0.85"/>
    <path d="M30 16 L42 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Top Helmet Fin -->
    <path d="M20 2 Q26 -6 32 2" stroke="#15803D" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>